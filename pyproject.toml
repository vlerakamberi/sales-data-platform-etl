[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-data-platform-etl"
version = "0.1.0"
description = "Enterprise-grade local ETL pipeline demonstrating production-quality data engineering practices."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [
    { name = "vlerakamberi" },
]
dependencies = [
    "pydantic>=2.13.4,<3.0",
    "pydantic-settings>=2.15.0,<3.0",
    "psycopg[binary]>=3.3.4,<4",
    "PyYAML>=6.0.3,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10.0",
    "pytest-cov>=7.1.0,<8.0",
    "ruff>=0.16.2,<0.17.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "postgresql: requires the dedicated Repository 1 PostgreSQL test database",
]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=src/sales_data_platform",
    "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
source = ["src/sales_data_platform"]

[tool.coverage.report]
show_missing = true
skip_covered = true
