version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stderr
  rotating_file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: standard
    filename: sales_data_platform.log
    maxBytes: 5242880
    backupCount: 3
    encoding: utf-8

loggers:
  sales_data_platform:
    level: INFO
    handlers: []
    propagate: true

root:
  level: INFO
  handlers:
    - console
